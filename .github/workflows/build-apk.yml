name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify active Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_TITLE="Release $RELEASE_TAG"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          gh release create "$RELEASE_TAG" "$APK_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "AnkitVerse automated build for commit ${{ github.sha }} (Run #${{ github.run_number }}, Attempt #${{ github.run_attempt }})." \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_TITLE="Release $RELEASE_TAG"
          APK_FILENAME="app-debug.apk"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== Release Publishing Succeeded ==="
            gh release view "$RELEASE_TAG"
            RELEASE_URL="$REPO_URL/releases/tag/$RELEASE_TAG"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $APK_FILENAME"

            {
              echo "## APK Build & Release Summary"
              echo ""
              echo "**Status:** Release published successfully."
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** \`$RELEASE_TITLE\`"
              echo "- **Release Page:** [View Release on GitHub]($RELEASE_URL)"
              echo "- **APK Asset:** \`$APK_FILENAME\`"
              echo ""
              echo "### How to Download"
              echo "1. The APK is directly downloadable from the **Assets** section of the [GitHub Release]($RELEASE_URL)."
              echo "2. The normal Actions artifact named \`app-debug-apk\` is also available as a backup from the Actions run summary."
            } >> "$GITHUB_STEP_SUMMARY"

          else
            echo "::warning::Release publishing failed or was skipped."
            echo "APK build succeeded."
            echo "The Actions artifact named app-debug-apk remains available."

            {
              echo "## APK Build & Release Summary"
              echo ""
              echo "> ⚠️ **Warning:** Release publishing encountered an issue or failed."
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Actions Artifact:** \`app-debug-apk\` is available for download directly from the GitHub Actions run summary."
              echo ""
              echo "The compiled APK was preserved and uploaded as an Actions artifact named \`app-debug-apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
